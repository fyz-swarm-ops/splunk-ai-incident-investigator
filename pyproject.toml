[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splunk-incident-lab"
version = "0.1.0"
description = "Read-only Splunk incident investigation lab with structured evidence."
requires-python = ">=3.11"
dependencies = ["certifi>=2026.7.22"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
splunk-incident-lab = "splunk_incident_lab.cli:main"
